<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ReviewPlatform</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <!-- TOP NAVIGATION -->
    <header class="auth-navbar">
        <div class="nav-brand">ReviewPlatform</div>
        <div class="nav-right">
            <a href="login.html">Log in</a>
            <a href="business-signup.html" class="btn-business">For businesses</a>
        </div>
    </header>

    <!-- SPLIT SCREEN CONTAINER -->
    <div class="auth-container">
        <!-- LEFT BRANDING PANEL -->
        <div class="auth-left-panel">
            <div class="brand-content">
                <h1>Join ReviewPlatform today.</h1>
                <p>Create your free account to review companies, share feedback, and explore ratings.</p>
                <div class="trust-badge">
                    <span>🚀 Fast & Easy Setup</span>
                    <span>🤝 Community Driven</span>
                </div>
            </div>
        </div>

        <!-- RIGHT FORM PANEL -->
        <div class="auth-right-panel">
            <div class="auth-card">
                <h2>Create your account</h2>
                <p class="auth-subtitle">Get started with your free profile.</p>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your full name" maxlength="255" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="btn-primary">Create account</button>

                    <!-- Message container for JavaScript -->
                    <div id="message" style="margin-top: 15px; font-weight: 600; font-size: 13px;"></div>
                </form>

                <div class="auth-footer-text">
                    Already have an account? <a href="login.html">Log in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
