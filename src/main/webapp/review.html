<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Reviews</title>
<link rel="stylesheet" href="css/review.css">
</head>
<body>
	<div class="review-container">
		<h1>Website Reviews</h1>
		<div id="websiteInfo"></div>
		<hr>
		<h2>Add Your Review</h2>
		<form id="reviewForm">
			<div class="form-group">
				<label>Rating</label> <select id="rating" required>
					<option value="">Select Rating</option>
					<option value="1">⭐ 1</option>
					<option value="2">⭐⭐ 2</option>
					<option value="3">⭐⭐⭐ 3</option>
					<option value="4">⭐⭐⭐⭐ 4</option>
					<option value="5">⭐⭐⭐⭐⭐ 5</option>
				</select>
			</div>
			<div class="form-group">
				<label>Comment</label>
				<textarea id="comment" placeholder="Write your review..." required></textarea>
			</div>
			<button type="submit">Submit Review</button>
		</form>
		<p id="message"></p>
		<hr>
		<h2>Reviews</h2>
		<div id="reviewList">Loading reviews...</div>
		<br> <a href="index.html"> ← Back to Home </a>
	</div>
	<script src="js/review.js"></script>
</body>
</html>
