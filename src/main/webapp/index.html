<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewHub</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-white shadow-sm">
		<div class="container">
			<a class="navbar-brand fw-bold" href="#">ReviewHub</a>
			<div class="ms-auto">
				<a href="#websites" class="btn btn-outline-primary">Websites</a>
			</div>
		</div>
	</nav>
	<section class="py-5">
		<div class="container">
			<div class="text-center">
				<h1 class="fw-bold">Find a Website</h1>
				<p class="text-muted">Search a website and read or write
					reviews.</p>
			</div>
			<div class="row justify-content-center mt-4">
				<div class="col-md-7">
					<div class="input-group">
						<input type="text" id="searchInput" class="form-control"
							placeholder="Enter website name">
						<button class="btn btn-primary" onclick="searchWebsite()">Search</button>
					</div>
				</div>
			</div>
		</div>
	</section>
	<section class="py-4 bg-light">
		<div class="container">
			<h3 class="mb-3">Add Website</h3>
			<form id="websiteForm">
				<div class="mb-3">
					<label class="form-label"> Website Name </label> <input type="text" id="websiteName" class="form-control" required>
				</div>
				<div class="mb-3">
					<label class="form-label"> Website URL </label> <input type="url" id="websiteUrl" class="form-control" placeholder="https://example.com" required>
				</div>
				<div class="mb-3">
					<label class="form-label"> Description </label>
					<textarea id="websiteDescription" class="form-control" rows="3"required></textarea>
				</div>
				<button type="submit" class="btn btn-success">Submit Website</button>
			</form>
			<p id="websiteMessage" class="mt-3"></p>
		</div>
	</section>
	<section class="py-5" id="websites">
		<div class="container">
			<h2 class="fw-bold mb-4">Websites</h2>
			<div class="row g-4" id="websiteList">
				<p class="text-muted">Loading websites...</p>
			</div>
		</div>
	</section>
	<footer class="bg-dark text-white text-center py-3">
		<p class="mb-0">ReviewHub</p>
	</footer>
	<script src="js/script.js"></script>

</body>

</html>
