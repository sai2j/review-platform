
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Review Platform</title>
<link rel="stylesheet" href="/review-platform/css/reset-password.css">
</head>
<body>
	<main class="container">
		<div class="card">
			<h1>Reset Password</h1>
			<p class="description">Enter your new password below. The reset
				link is valid for 30 minutes.</p>
			<form id="resetPasswordForm">
				<label for="newPassword">New Password</label> <input type="password"
					id="newPassword" name="newPassword"
					placeholder="Enter new password" minlength="8" maxlength="100"
					autocomplete="new-password" required> <label
					for="confirmPassword">Confirm New Password</label> <input
					type="password" id="confirmPassword" name="confirmPassword"
					placeholder="Confirm new password" minlength="8" maxlength="100"
					autocomplete="new-password" required>
				<button type="submit" id="submitBtn">Reset Password</button>
			</form>
			<p id="message" role="status" aria-live="polite"></p>
			<a class="back-link" href="/review-platform/index.html"> Back to
				Login </a>
		</div>
	</main>
	<script src="/review-platform/js/reset-password.js"></script>
</body>
</html>
