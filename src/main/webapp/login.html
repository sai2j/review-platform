<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, follow">

    <title>Login - Review Platform</title>

    <link rel="stylesheet"
          href="css/login.css">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="top-navbar">

    <div class="navbar-container">


        <!-- LOGO -->

        <a href="index.html"
           class="brand-logo">

            <span class="brand-star">
                ★
            </span>

            <span>
                Review<span class="brand-highlight">Platform</span>
            </span>

        </a>


        <!-- NAVIGATION -->

        <nav class="navbar-links">


            <a href="login.html"
               class="login-link">

                Log in

            </a>


            <a href="business-dashboard.html"
               class="business-button">

                For businesses

            </a>


        </nav>

    </div>

</header>



<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<main class="login-page">


    <section class="login-section">


        <h1>
            Read reviews. Write reviews. Find companies.
        </h1>


        <!-- LOGIN CARD -->

        <div class="login-card">


            <h2>
                Log in or sign up below
            </h2>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-submit-button">

                    Log in

                </button>


            </form>


            <!-- LOGIN MESSAGE -->

            <p id="message"></p>


            <!-- REGISTER -->

            <p class="signup-text">

                Don't have an account?

                <a href="register.html">
                    Sign up
                </a>

            </p>


        </div>


    </section>



    <!-- =================================================
         BUSINESS SECTION
    ================================================= -->

    <section class="business-section">


        <h2>
            Are you a business?
        </h2>


        <p>
            Set up your business account on Review Platform for free
        </p>


        <div class="business-actions">


            <a
                href="login.html"
                class="business-login-button">

                Log in

            </a>


            <a
                href="register.html"
                class="business-signup-button">

                Sign up

            </a>


        </div>


    </section>


</main>



<!-- LOGIN JAVASCRIPT -->

<script src="js/login.js"></script>


</body>

</html>
