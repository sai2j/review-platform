<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Response</title>
<link rel="stylesheet" href="css/business-response.css">
</head>
<body>
	<div class="response-container">
		<h1>Business Response</h1>
		<p>Respond to your customer review</p>
		<div class="review-box">
			<h3>Customer Review</h3>
			<p id="reviewText">Loading review...</p>
			<p id="reviewRating">Rating: Loading...</p>
		</div>
		<form id="responseForm">
			<div class="form-group">
				<label for="response"> Your Response </label>
				<textarea id="response" placeholder="Write your response..."required>
                </textarea>
			</div>
			<button type="submit">Submit Response</button>
		</form>
		<p id="message"></p>
		<br>
		<a href="index.html"> ← Back to Home </a>
	</div>
	<script src="js/business-response.js"></script>
</body>
</html>
