<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration - Review Platform</title>
<link rel="stylesheet" href="css/register.css">
</head>
<body>
	<div class="register-container">
		<h2>Create Account</h2>
		<form id="registerForm">
			<div class="form-group">
				<label>Email</label> <input type="email" id="email"placeholder="Enter your email" required>
			</div>
			<div class="form-group">
				<label>Password</label> <input type="password" id="password"placeholder="Enter your password" required>
			</div>
			<button type="submit">Register</button>
		</form>
		<p id="message"></p>
		<p>Already have an account? <a href="index.html"> Login </a></p>
	</div>
	<script src="js/register.js"></script>
</body>
</html>
