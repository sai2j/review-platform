
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>My Profile - Review Platform</title>
<link rel="stylesheet" href="css/user-profile.css">
</head>
<body>
	<div class="profile-container">
		<header class="profile-header">
			<div>
				<h1>My Profile</h1>
				<p>Manage your public profile information.</p>
			</div>

			<button type="button" class="back-button" onclick="goToDashboard()">
				Back to Dashboard</button>
		</header>

		<main class="profile-card">
			<div class="profile-intro">
				<div class="profile-avatar" id="profileAvatar">U</div>

				<div>
					<h2 id="profileDisplayName">Loading profile...</h2>
					<p id="profileDisplayEmail"></p>
					<span id="profileVisibilityBadge" class="visibility-badge">
						Loading... </span>
				</div>
			</div>

			<section class="avatar-upload-section">
				<h3>Profile Photo</h3>

				<label for="avatarFile">Choose a photo</label> <input type="file"
					id="avatarFile" name="file"
					accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">

				<small>JPG, PNG or WebP. Maximum size: 2 MB.</small>

				<button type="button" id="uploadAvatarButton">Upload Photo
				</button>
			</section>

			<div id="profileMessage" class="message" role="status"
				aria-live="polite"></div>

			<form id="profileForm">
				<div class="form-group">
					<label for="profileName">Full Name</label> <input type="text"
						id="profileName" name="name" maxlength="100"
						placeholder="Enter your name" required>
				</div>

				<div class="form-group">
					<label for="profileEmail">Email Address</label> <input type="email"
						id="profileEmail" name="email" readonly> <small>Your
						registered email address cannot be changed here.</small>
				</div>

				<div class="form-group">
					<label for="profileBio">Bio</label>
					<textarea id="profileBio" name="bio" maxlength="500" rows="5"
						placeholder="Tell people a little about yourself"></textarea>
					<small><span id="bioCount">0</span>/500 characters</small>
				</div>

				<div class="form-group">
					<label for="profileCountry">Country</label> <input type="text"
						id="profileCountry" name="country" maxlength="100"
						placeholder="Enter your country">
				</div>

				<div class="form-group">
					<label for="profileVisibility">Profile Visibility</label> <select
						id="profileVisibility" name="profilePublic">
						<option value="true">Public - Anyone can view my profile</option>
						<option value="false">Private - Keep my profile private</option>
					</select> <small> Private profiles should be restricted by the
						backend. </small>
				</div>

				<div class="form-actions">
					<button type="submit" id="saveProfileButton">Save Changes
					</button>

					<button type="button" class="cancel-button"
						onclick="goToDashboard()">Cancel</button>
				</div>
			</form>
		</main>
	</div>

	<script src="js/user-profile.js"></script>
</body>
</html>
