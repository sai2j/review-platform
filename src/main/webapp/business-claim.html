<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Business</title>
<link rel="stylesheet" href="css/business-claim.css">
</head>
<body>
	<div class="claim-container">
		<h1>Claim Your Business</h1>
		<p>Submit a request to claim this business.</p>
		<form id="claimForm">
			<div class="form-group">
				<label>Business ID</label> <input type="number" id="businessId"readonly required>
			</div>
			<div class="form-group">
				<label>User ID</label> <input type="number" id="userId" placeholder="Enter User ID" required>
			</div>
			<button type="submit">Submit Claim</button>
		</form>
		<p id="message"></p>
		<br>
		<a href="index.html">← Back to Home</a>
	</div>
	<script src="js/business-claim.js"></script>
</body>
</html>
