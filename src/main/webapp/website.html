<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Details | ReviewPlatform</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f7ff;
            color: #0b1117;
            padding-bottom: 50px;
        }

        /* NAVBAR */
        .auth-navbar {
            background: #0b1117;
            color: #ffffff;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 20px;
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-right a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-right a:hover {
            color: #ffffff;
        }

        /* CONTAINER */
        .dashboard-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumb-nav {
            font-size: 13px;
            color: #475569;
            margin-bottom: 20px;
        }

        .breadcrumb-nav a {
            color: #0369a1;
            text-decoration: none;
            font-weight: 600;
        }

        .breadcrumb-nav a:hover {
            text-decoration: underline;
        }

        .dashboard-section {
            margin-bottom: 30px;
        }

        .dashboard-section h2 {
            font-size: 18px;
            font-weight: 700;
            color: #0b1117;
            margin-bottom: 12px;
        }

        /* CARDS */
        .info-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 12px rgba(11, 17, 23, 0.03);
            margin-bottom: 16px;
        }

        .info-card h2 {
            margin-top: 0;
            font-size: 22px;
            color: #0b1117;
        }

        .info-card p {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            margin: 8px 0;
        }

        .info-card a {
            color: #0369a1;
            text-decoration: none;
            font-weight: 600;
        }

        .info-card a:hover {
            text-decoration: underline;
        }

        .rating-display {
            margin: 15px 0;
            font-weight: 700;
            font-size: 15px;
            color: #0b1117;
        }

        /* BUTTONS */
        .btn-primary {
            display: inline-block;
            background: #0b1117;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #1e293b;
        }

        /* REVIEWS GRID */
        .reviews-grid-slides {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .verified-badge {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <header class="auth-navbar">
        <div class="nav-brand">ReviewPlatform</div>
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Websites</a>
            <a href="login.html" id="authLink">Log in</a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="dashboard-container">
        
        <div class="breadcrumb-nav">
            <a href="index.html">Home</a> &gt; <span id="breadcrumbWebsiteName">Website Details</span>
        </div>

        <!-- WEBSITE INFO CARD -->
        <div class="dashboard-section" id="mainWebsiteSection">
            <div class="info-card" id="websiteInfoCard">
                <h2 id="webName">Loading website... <span class="verified-badge">Verified</span></h2>
                <p id="webDesc">Please wait while we load details.</p>
                <p><strong>Website URL:</strong> <a id="webUrl" href="#" target="_blank">Not available</a></p>
                <div class="rating-display">
                    <span id="webRatingStars">⭐ 0.0 / 5</span> 
                    <span id="webReviewCount">(0 reviews)</span>
                </div>
                <div style="margin-top: 20px;">
                    <a id="reviewActionBtn" href="#" class="btn-primary">Read & Write Reviews</a>
                </div>
            </div>
        </div>

        <!-- VERIFIED WEBSITES LIST -->
        <div class="dashboard-section" id="verifiedListSection" style="display: none;">
            <h2>Top Verified Websites</h2>
            <div id="verifiedWebsitesContainer" class="reviews-grid-slides">
                <!-- Dynamically loaded verified websites -->
            </div>
        </div>

        <!-- CUSTOMER REVIEWS SECTION -->
        <div class="dashboard-section" id="reviewsSection">
            <h2>Customer Reviews</h2>
            <div id="customerReviewsContainer" class="reviews-grid-slides">
                <div class="info-card">
                    <p>Loading reviews...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const urlParams = new URLSearchParams(window.location.search);
            let websiteId = urlParams.get('id') || urlParams.get('websiteId');

            // Check logged in user status
            const loggedInUserStr = localStorage.getItem("loggedInUser");
            const authLink = document.getElementById("authLink");
            let loggedInUser = null;

            if (loggedInUserStr) {
                try {
                    loggedInUser = JSON.parse(loggedInUserStr);
                } catch (e) {
                    loggedInUser = null;
                }
            }

            if (loggedInUser && authLink) {
                authLink.textContent = "My Profile";
                authLink.href = "user-profile.html";
            }

            // If no ID in URL, check if logged-in user has a registered business
            if (!websiteId && loggedInUser && loggedInUser.id) {
                try {
                    const bizResp = await fetch(`/review-platform/business-dashboard/user/${loggedInUser.id}`);
                    if (bizResp.ok) {
                        const bizData = await bizResp.json();
                        console.log("Fetched User Business Data:", bizData);
                        
                        // Handle both single object or array response formats
                        let targetBusiness = null;
                        if (Array.isArray(bizData) && bizData.length > 0) {
                            targetBusiness = bizData[0];
                        } else if (bizData && (bizData.id || bizData.businessId || bizData.websiteId)) {
                            targetBusiness = bizData;
                        }

                        if (targetBusiness) {
                            websiteId = targetBusiness.id || targetBusiness.businessId || targetBusiness.websiteId;
                        }
                    }
                } catch (err) {
                    console.error("Error fetching user business:", err);
                }
            }

            // If still no websiteId, load Top Verified Websites list view
            if (!websiteId) {
                document.getElementById("mainWebsiteSection").style.display = "none";
                document.getElementById("reviewsSection").style.display = "none";
                document.getElementById("verifiedListSection").style.display = "block";
                document.getElementById("breadcrumbWebsiteName").textContent = "Verified Websites";

                try {
                    const allWebsResp = await fetch('/review-platform/websites');
                    const verifiedContainer = document.getElementById("verifiedWebsitesContainer");
                    if (allWebsResp.ok) {
                        const websites = await allWebsResp.json();
                        if (websites && websites.length > 0) {
                            verifiedContainer.innerHTML = "";
                            websites.forEach(w => {
                                const card = document.createElement("div");
                                card.className = "info-card";
                                card.innerHTML = `
                                    <h3 style="margin-top:0;"><a href="website.html?id=${w.id}">${w.name}</a> <span class="verified-badge">Verified</span></h3>
                                    <p>${w.description || 'No description available.'}</p>
                                    <p style="font-size:13px; font-weight:600; margin-top:8px;">⭐ ${w.averageRating ? w.averageRating.toFixed(1) : '0.0'} / 5 (${w.totalReviews || 0} reviews)</p>
                                    <a href="website.html?id=${w.id}" class="btn-primary" style="margin-top:10px; display:inline-block;">View Details & Reviews</a>
                                `;
                                verifiedContainer.appendChild(card);
                            });
                        } else {
                            verifiedContainer.innerHTML = '<div class="info-card"><p>No verified websites found at the moment.</p></div>';
                        }
                    }
                } catch (e) {
                    console.error("Error loading verified list:", e);
                }
                return;
            }

            // Load specific website details
            try {
                const response = await fetch(`/review-platform/websites/${websiteId}`);
                if (response.ok) {
                    const website = await response.json();
                    document.getElementById("webName").innerHTML = `${website.name || "Unnamed Website"} <span class="verified-badge">Verified</span>`;
                    document.getElementById("breadcrumbWebsiteName").textContent = website.name || "Website Details";
                    document.getElementById("webDesc").textContent = website.description || "No description available.";
                    
                    const webUrlElem = document.getElementById("webUrl");
                    if (website.url) {
                        webUrlElem.href = website.url;
                        webUrlElem.textContent = website.url;
                    } else {
                        webUrlElem.textContent = "Not provided";
                    }

                    if (website.averageRating !== undefined) {
                        document.getElementById("webRatingStars").textContent = `⭐ ${website.averageRating.toFixed(1)} / 5`;
                    }
                    if (website.totalReviews !== undefined) {
                        document.getElementById("webReviewCount").textContent = `(${website.totalReviews} reviews)`;
                    }

                    const reviewBtn = document.getElementById("reviewActionBtn");
                    reviewBtn.href = `review.html?id=${websiteId}`;
                } else {
                    document.getElementById("mainWebsiteSection").innerHTML = `
                        <div class="info-card">
                            <h2>Website Not Found</h2>
                            <p>Requested website does not exist in our database.</p>
                            <a href="browse.html" class="btn-primary" style="margin-top:15px; display:inline-block;">Browse All Websites</a>
                        </div>
                    `;
                    document.getElementById("reviewsSection").style.display = "none";
                    return;
                }

                // Fetch and display working customer reviews
                const reviewsResponse = await fetch(`/review-platform/reviews/website/${websiteId}`);
                const reviewsContainer = document.getElementById("customerReviewsContainer");
                
                if (reviewsResponse.ok) {
                    const reviews = await reviewsResponse.json();
                    if (reviews && reviews.length > 0) {
                        reviewsContainer.innerHTML = "";
                        reviews.forEach(review => {
                            const card = document.createElement("div");
                            card.className = "info-card";
                            card.innerHTML = `
                                <div style="font-weight: 700; margin-bottom: 6px; color: #d97706;">⭐ ${review.rating || 5} / 5</div>
                                <p style="font-size: 14px; color: #0b1117; font-weight: 500;">${review.comment || review.content || "Great platform and service!"}</p>
                                <p style="font-size: 12px; color: #64748b; margin-top: 10px;">Reviewed by: ${review.userName || review.userEmail || 'Verified User'}</p>
                            `;
                            reviewsContainer.appendChild(card);
                        });
                    } else {
                        reviewsContainer.innerHTML = '<div class="info-card"><p>No approved reviews are available for this website yet. Be the first to write a review!</p></div>';
                    }
                } else {
                    reviewsContainer.innerHTML = '<div class="info-card"><p>No reviews found for this website.</p></div>';
                }

            } catch (error) {
                console.error("Error loading website details or reviews:", error);
                document.getElementById("customerReviewsContainer").innerHTML = '<div class="info-card"><p>Unable to load customer reviews at this moment.</p></div>';
            }
        });
    </script>
</body>
</html>
