<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Details | ReviewPlatform</title>
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<script src="js/sidebar-layout.js"></script>
</head>

<style>
*, *::before, *::after {
	box-sizing: border-box;
}

body {
	margin: 0;
	font-family: Arial, Helvetica, sans-serif;
	background: #f2faf6;
	color: #0b1117;
	padding-bottom: 50px;
}

/* NAVBAR */
.auth-navbar {
	background: #0b1117;
	color: #ffffff;
	padding: 16px 40px;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.nav-brand {
	font-weight: 700;
	font-size: 20px;
	color: #ffffff;
}

.nav-right {
	display: flex;
	align-items: center;
	gap: 24px;
}

.nav-right a {
	color: #cbd5e1;
	text-decoration: none;
	font-size: 14px;
	font-weight: 600;
}

.nav-right a:hover {
	color: #ffffff;
}

/* CONTAINER */
.dashboard-container {
	max-width: 900px;
	margin: 30px auto;
	padding: 0 20px;
}

.breadcrumb-nav {
	font-size: 13px;
	color: #475569;
	margin-bottom: 20px;
}

.breadcrumb-nav a {
	color: #009765;
	text-decoration: none;
	font-weight: 600;
}

.breadcrumb-nav a:hover {
	text-decoration: underline;
}

.dashboard-section {
	margin-bottom: 30px;
}

.dashboard-section h2 {
	font-size: 18px;
	font-weight: 700;
	color: #0b1117;
	margin-bottom: 12px;
}

/* CARDS */
.info-card {
	background: #ffffff;
	border: 1px solid #e2f0eb;
	border-radius: 16px;
	padding: 24px;
	box-shadow: 0 4px 12px rgba(11, 17, 23, 0.03);
	margin-bottom: 16px;
}

.info-card h2 {
	margin-top: 0;
	font-size: 22px;
	color: #0b1117;
}

.info-card p {
	font-size: 14px;
	color: #334155;
	line-height: 1.5;
	margin: 8px 0;
}

.info-card a {
	color: #009765;
	text-decoration: none;
	font-weight: 600;
}

.info-card a:hover {
	text-decoration: underline;
}

.rating-display {
	margin: 15px 0;
	font-weight: 700;
	font-size: 15px;
	color: #0b1117;
}

/* BUTTONS */
.btn-primary {
	display: inline-block;
	background: #00b67a;
	color: #ffffff;
	padding: 10px 20px;
	border-radius: 10px;
	font-size: 13px;
	font-weight: 700;
	text-decoration: none;
	transition: background 0.2s;
}

.btn-primary:hover {
	background: #009765;
}

.info-card a.btn-primary,
.info-card a.btn-primary:hover {
	color: #ffffff;
	text-decoration: none;
}

/* REVIEWS GRID */
.reviews-grid-slides {
	display: flex;
	flex-direction: column;
	gap: 15px;
}

.verified-badge {
	background: #e6f7f0;
	color: #009765;
	font-size: 11px;
	font-weight: 700;
	padding: 3px 8px;
	border-radius: 6px;
	margin-left: 8px;
	display: inline-block;
	vertical-align: middle;
}


/* Phone: long names / links / comments wrap instead of widening the page */
.info-card,
.info-card h2,
.info-card h3,
.info-card p,
.info-card a {
	overflow-wrap: anywhere;
	word-break: break-word;
}

.dashboard-container,
.dashboard-section,
.info-card {
	min-width: 0;
}

@media (max-width: 600px) {
	.dashboard-container {
		margin: 18px auto;
		padding: 0 14px;
	}

	.info-card {
		padding: 18px;
		border-radius: 14px;
	}

	.info-card h2 {
		font-size: 20px;
	}
}

/* Pager (Previous / Next) and Load more button */
.pager {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 14px;
	margin-top: 8px;
}

.pager-info {
	font-size: 13px;
	font-weight: 700;
	color: #47695c;
}

.pager-btn {
	background: #ffffff;
	color: #009765;
	border: 1.5px solid #00b67a;
	border-radius: 999px;
	padding: 9px 20px;
	font-size: 13px;
	font-weight: 700;
	cursor: pointer;
	transition: background 0.2s;
}

.pager-btn:hover:not(:disabled) {
	background: #e6f7f0;
}

.pager-btn:disabled {
	opacity: 0.45;
	cursor: not-allowed;
}

.load-more-wrap {
	display: flex;
	justify-content: center;
	margin-top: 4px;
}
</style>
</head>
<body>

	<!-- TOP NAVIGATION -->
	<header class="auth-navbar">
		<div class="nav-brand">
			Review<span>Platform</span>
		</div>
		<div class="nav-right">
			<a href="index.html">Home</a> <a href="browse.html">Browse
				Websites</a> <a href="login.html" id="authLink">Log in</a>
		</div>
	</header>

	<!-- MAIN CONTAINER -->
	<div class="dashboard-container">

		<div class="breadcrumb-nav">
			<a href="index.html">Home</a> &gt; <span id="breadcrumbWebsiteName">Website
				Details</span>
		</div>

		<!-- WEBSITE INFO CARD -->
		<div class="dashboard-section" id="mainWebsiteSection">
			<div class="info-card" id="websiteInfoCard">
				<h2 id="webName">
					Loading website... <span class="verified-badge">Verified</span>
				</h2>
				<p id="webDesc">Please wait while we load details.</p>
				<p>
					<strong>Website URL:</strong> <a id="webUrl" href="#"
						target="_blank">Not available</a>
				</p>
				<div class="rating-display">
					<span id="webRatingStars">⭐ 0.0 / 5</span> <span
						id="webReviewCount">(0 reviews)</span>
				</div>
				<div style="margin-top: 20px;">
					<a id="reviewActionBtn" href="#" class="btn-primary">Read &
						Write Reviews</a>
				</div>
			</div>
		</div>

		<!-- VERIFIED WEBSITES LIST -->
		<div class="dashboard-section" id="verifiedListSection"
			style="display: none;">
			<h2>Top Verified Websites</h2>
			<div id="verifiedWebsitesContainer" class="reviews-grid-slides">
				<!-- Dynamically loaded verified websites -->
			</div>
			<div class="pager" id="websitesPager" style="display: none;">
				<button type="button" class="pager-btn" id="websitesPrev">&larr; Previous</button>
				<span class="pager-info" id="websitesPageInfo">Page 1</span>
				<button type="button" class="pager-btn" id="websitesNext">Next &rarr;</button>
			</div>
		</div>

		<!-- CUSTOMER REVIEWS SECTION -->
		<div class="dashboard-section" id="reviewsSection">
			<h2>Customer Reviews</h2>
			<div id="customerReviewsContainer" class="reviews-grid-slides">
				<div class="info-card">
					<p>Loading reviews...</p>
				</div>
			</div>
			<div class="load-more-wrap">
				<button type="button" class="pager-btn" id="loadMoreReviews" style="display: none;">Load more reviews</button>
			</div>
		</div>

	</div>

	<!-- SCRIPT LOGIC -->
	<script>
        function escapeHtml(value) {
            return String(value === undefined || value === null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        document.addEventListener("DOMContentLoaded", async function() {
            const urlParams = new URLSearchParams(window.location.search);
            let websiteId = urlParams.get('id') || urlParams.get('websiteId');

            // Check logged in user status
            const loggedInUserStr = localStorage.getItem("loggedInUser");
            const authLink = document.getElementById("authLink");
            let loggedInUser = null;

            if (loggedInUserStr) {
                try {
                    loggedInUser = JSON.parse(loggedInUserStr);
                } catch (e) {
                    loggedInUser = null;
                }
            }

            if (loggedInUser && authLink) {
                authLink.textContent = "My Profile";
                authLink.href = "user-profile.html";
            }

            // If no ID in URL, check if logged-in user has a registered business
            if (!websiteId && loggedInUser && loggedInUser.id) {
                try {
                    const bizResp = await fetch(`/review-platform/business-dashboard/user/${loggedInUser.id}`);
                    if (bizResp.ok) {
                        const bizData = await bizResp.json();
                        console.log("Fetched User Business Data:", bizData);
                        
                        // Handle both single object or array response formats
                        let targetBusiness = null;
                        if (Array.isArray(bizData) && bizData.length > 0) {
                            targetBusiness = bizData[0];
                        } else if (bizData && bizData.websiteId) {
                            targetBusiness = bizData;
                        }

                        // Only the real website id is used (business id is a different table)
                        if (targetBusiness && targetBusiness.websiteId) {
                            websiteId = targetBusiness.websiteId;
                        }
                    }
                } catch (err) {
                    console.error("Error fetching user business:", err);
                }
            }

            // If still no websiteId, load Top Verified Websites list view
            if (!websiteId) {
                document.getElementById("mainWebsiteSection").style.display = "none";
                document.getElementById("reviewsSection").style.display = "none";
                document.getElementById("verifiedListSection").style.display = "block";
                document.getElementById("breadcrumbWebsiteName").textContent = "Verified Websites";

                try {
                    const allWebsResp = await fetch('/review-platform/websites');
                    const verifiedContainer = document.getElementById("verifiedWebsitesContainer");
                    if (allWebsResp.ok) {
                        const websites = await allWebsResp.json();
                        if (websites && websites.length > 0) {
                            const PAGE_SIZE = 5;
                            const totalPages = Math.ceil(websites.length / PAGE_SIZE);
                            let currentPage = 1;
                            const pager = document.getElementById("websitesPager");
                            const prevBtn = document.getElementById("websitesPrev");
                            const nextBtn = document.getElementById("websitesNext");
                            const pageInfo = document.getElementById("websitesPageInfo");

                            const renderWebsitesPage = function () {
                                verifiedContainer.innerHTML = "";
                                websites.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE).forEach(w => {
                                    const card = document.createElement("div");
                                    card.className = "info-card";
                                    card.innerHTML = `
                                        <h3 style="margin-top:0;"><a href="website.html?id=${w.id}">${escapeHtml(w.name)}</a> <span class="verified-badge">Verified</span></h3>
                                        <p>${escapeHtml(w.description || 'No description available.')}</p>
                                        <p style="font-size:13px; font-weight:600; margin-top:8px;">⭐ ${w.averageRating ? w.averageRating.toFixed(1) : '0.0'} / 5 (${w.totalReviews || 0} reviews)</p>
                                        <a href="website.html?id=${w.id}" class="btn-primary" style="margin-top:10px; display:inline-block;">View Details & Reviews</a>
                                    `;
                                    verifiedContainer.appendChild(card);
                                });
                                pageInfo.textContent = "Page " + currentPage + " of " + totalPages;
                                prevBtn.disabled = currentPage === 1;
                                nextBtn.disabled = currentPage === totalPages;
                                pager.style.display = totalPages > 1 ? "flex" : "none";
                            };

                            prevBtn.onclick = function () {
                                if (currentPage > 1) { currentPage--; renderWebsitesPage(); window.scrollTo({ top: 0, behavior: "smooth" }); }
                            };
                            nextBtn.onclick = function () {
                                if (currentPage < totalPages) { currentPage++; renderWebsitesPage(); window.scrollTo({ top: 0, behavior: "smooth" }); }
                            };

                            renderWebsitesPage();
                        } else {
                            verifiedContainer.innerHTML = '<div class="info-card"><p>No verified websites found at the moment.</p></div>';
                        }
                    }
                } catch (e) {
                    console.error("Error loading verified list:", e);
                }
                return;
            }

            // Load specific website details
            try {
                const response = await fetch(`/review-platform/websites/${websiteId}`);
                if (response.ok) {
                    const website = await response.json();
                    document.getElementById("webName").innerHTML = `${website.name || "Unnamed Website"} <span class="verified-badge">Verified</span>`;
                    document.getElementById("breadcrumbWebsiteName").textContent = website.name || "Website Details";
                    document.getElementById("webDesc").textContent = website.description || "No description available.";
                    
                    const webUrlElem = document.getElementById("webUrl");
                    if (website.url) {
                        webUrlElem.href = website.url;
                        webUrlElem.textContent = website.url;
                    } else {
                        webUrlElem.textContent = "Not provided";
                    }

                    if (website.averageRating !== undefined) {
                        document.getElementById("webRatingStars").textContent = `⭐ ${website.averageRating.toFixed(1)} / 5`;
                    }
                    if (website.totalReviews !== undefined) {
                        document.getElementById("webReviewCount").textContent = `(${website.totalReviews} reviews)`;
                    }

                    const reviewBtn = document.getElementById("reviewActionBtn");
                    reviewBtn.href = `review.html?id=${websiteId}`;
                } else {
                    document.getElementById("mainWebsiteSection").innerHTML = `
                        <div class="info-card">
                            <h2>Website Not Found</h2>
                            <p>Requested website does not exist in our database.</p>
                            <a href="browse.html" class="btn-primary" style="margin-top:15px; display:inline-block;">Browse All Websites</a>
                        </div>
                    `;
                    document.getElementById("reviewsSection").style.display = "none";
                    return;
                }

                // Fetch and display customer reviews (5 at a time)
                const reviewsContainer = document.getElementById("customerReviewsContainer");
                const loadMoreBtn = document.getElementById("loadMoreReviews");
                const REVIEWS_PER_LOAD = 5;
                let reviewPage = 0;
                let shownReviews = 0;

                const appendReview = function (review) {
                    const card = document.createElement("div");
                    card.className = "info-card";
                    const rating = Number(review.rating) || 0;
                    const filled = Math.max(0, Math.min(5, Math.round(rating)));
                    const stars = '<span style="color:#d97706;">' + "★".repeat(filled) + '</span><span style="color:#d6e4dd;">' + "★".repeat(5 - filled) + '</span>';
                    const when = review.createdAt || review.reviewDate || review.date;
                    const whenText = when && !Array.isArray(when) && !isNaN(Date.parse(when))
                        ? new Date(when).toLocaleDateString() : "";
                    card.innerHTML = `
                        <div style="font-weight: 700; margin-bottom: 6px;">${stars} <span style="color:#0b1117;">${rating} / 5</span></div>
                        ${review.title ? `<p style="font-size: 15px; color: #0b1117; font-weight: 700; margin: 4px 0;">${escapeHtml(review.title)}</p>` : ""}
                        <p style="font-size: 14px; color: #0b1117; font-weight: 500;">${escapeHtml(review.comment || review.content || "")}</p>
                        <p style="font-size: 12px; color: #64748b; margin-top: 10px;">Reviewed by: ${escapeHtml(review.userName || review.username || review.userEmail || "Verified User")}${whenText ? " · " + whenText : ""}</p>
                    `;
                    reviewsContainer.appendChild(card);
                };

                const loadReviews = async function () {
                    loadMoreBtn.disabled = true;
                    const reviewsResponse = await fetch(`/review-platform/reviews/website/${websiteId}?page=${reviewPage}&size=${REVIEWS_PER_LOAD}`);

                    if (!reviewsResponse.ok) {
                        if (reviewPage === 0) {
                            reviewsContainer.innerHTML = '<div class="info-card"><p>No reviews found for this website.</p></div>';
                        }
                        loadMoreBtn.style.display = "none";
                        return;
                    }

                    // The API sends a page: { content: [...], totalElements: n }
                    const reviewData = await reviewsResponse.json();
                    const reviews = Array.isArray(reviewData) ? reviewData : (reviewData.content || []);
                    const totalReviews = Array.isArray(reviewData)
                        ? reviews.length
                        : (reviewData.totalElements !== undefined ? reviewData.totalElements : reviews.length);

                    document.getElementById("webReviewCount").textContent = `(${totalReviews} reviews)`;

                    if (reviewPage === 0) {
                        reviewsContainer.innerHTML = "";
                    }

                    if (reviewPage === 0 && reviews.length === 0) {
                        reviewsContainer.innerHTML = '<div class="info-card"><p>No approved reviews are available for this website yet. Be the first to write a review!</p></div>';
                        loadMoreBtn.style.display = "none";
                        return;
                    }

                    reviews.forEach(appendReview);
                    shownReviews += reviews.length;
                    reviewPage++;

                    const hasMore = Array.isArray(reviewData)
                        ? false
                        : (reviewData.last === false || shownReviews < totalReviews) && reviews.length > 0;

                    loadMoreBtn.style.display = hasMore ? "inline-block" : "none";
                    loadMoreBtn.disabled = false;
                    loadMoreBtn.textContent = "Load more reviews";
                };

                loadMoreBtn.addEventListener("click", loadReviews);
                await loadReviews();

            } catch (error) {
                console.error("Error loading website details or reviews:", error);
                document.getElementById("customerReviewsContainer").innerHTML = '<div class="info-card"><p>Unable to load customer reviews at this moment.</p></div>';
            }
        });
    </script>
</body>
</html>
