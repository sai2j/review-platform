<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Dashboard - Review Platform</title>

    <link rel="stylesheet" href="css/business-dashboard.css">
</head>

<body>

    <div class="dashboard-container">

        <h1>Business Dashboard</h1>

        <p class="dashboard-subtitle">
            Manage your business and view customer reviews
        </p>

        <hr>

        <!-- Business Information -->
        <section class="dashboard-section">

            <h2>Business Information</h2>

            <div id="businessInfo">
                Loading business information...
            </div>

        </section>

        <hr>

        <!-- Website Information -->
        <section class="dashboard-section">

            <h2>Website Information</h2>

            <div id="websiteInfo">
                Loading website information...
            </div>

        </section>

        <hr>

        <!-- Review Summary -->
        <section class="dashboard-section">

            <h2>Review Summary</h2>

            <div class="summary-box">

                <div class="summary-card">
                    <h3>Average Rating</h3>
                    <p id="averageRating">0.0</p>
                </div>

                <div class="summary-card">
                    <h3>Total Reviews</h3>
                    <p id="reviewCount">0</p>
                </div>

            </div>

        </section>

        <hr>

        <!-- Customer Reviews -->
        <section class="dashboard-section">

            <h2>Customer Reviews</h2>

            <div id="reviewList">
                Loading reviews...
            </div>

        </section>

        <br>

        <a href="index.html">← Back to Home</a>

    </div>

    <script src="js/business-dashboard.js"></script>

</body>

</html>
