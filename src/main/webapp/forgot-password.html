
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Review Platform</title>
<link rel="stylesheet" href="/review-platform/css/forgot-password.css">
</head>
<body>
	<main class="container">
		<div class="card">
			<h1>Forgot Password?</h1>
			<p class="description">Enter your registered email address. If an
				account exists, we will send you a password reset link.</p>
			<form id="forgotPasswordForm">
				<label for="email">Email Address</label> <input type="email"
					id="email" name="email" placeholder="Enter your registered email"
					required autocomplete="email">
				<button type="submit" id="submitBtn">Send Reset Link</button>
			</form>
			<p id="message" role="status" aria-live="polite"></p>
			<a class="back-link" href="/review-platform/index.html"> Back to
				Login </a>
		</div>
	</main>
	<script src="/review-platform/js/forgot-password.js"></script>
</body>
</html>
